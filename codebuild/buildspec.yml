version: 0.2

env:
  # You can override in Terraform or CodeBuild environment variables
  variables:
    IMAGE_TAG: "latest"
    AWS_DEFAULT_REGION: 'ap-southeast-2'
    ECS_CONTAINER_NAME: "web"
  parameter-store:
    # Optional: If you store sensitive values in SSM Parameter Store
    # DOCKER_PASSWORD: "/myapp/docker_password"
  secrets-manager:
    # Optional: If you use Secrets Manager
    # MY_SECRET: "myapp/secret_key:password"

phases:
  pre_build:
     # AWS_ACCOUNT_ID and ECR_REPO_NAME environment variables are set in CodeBuild via Terraform
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION \
        | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - REPOSITORY_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO_NAME}
      - echo "Repository URI: $REPOSITORY_URI"

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images to ECR...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo Writing image definitions file...
      - printf '[{"name":"%s","imageUri":"%s"}]' "${ECS_CONTAINER_NAME}" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files: imagedefinitions.json
