default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  host: <%= ENV.fetch('DB_HOST', 'localhost') %>
  username: <%= ENV.fetch('DB_USER', 'postgres') %>
  password: <%= ENV.fetch('DB_PASS', '') %>
  port: <%= ENV.fetch('DB_PORT', 5432) %>

development:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'amplify_development') %>

staging:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'amplify_staging') %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  password: null
  database: <%= ENV.fetch('DB_NAME', 'amplify_test') %>

production:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'amplify_production') %>
