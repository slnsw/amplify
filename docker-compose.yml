version: '3.8'

services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: amplify-production
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASS}
    restart: always
    volumes:
      - amplify_production_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"

  amplify:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9090:3000"
    depends_on:
      - postgres
    env_file:
      - .env
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    environment:
      RAILS_ENV: production
      DB_USER: ${DBUSER}
      DB_PASS: ${DBPASS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: amplify-production

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    command: bundle exec sidekiq -c 2 -C config/sidekiq.yml
    environment:
      DB_USER: ${DBUSER}
      DB_PASS: ${DBPASS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: amplify-production
      REDIS_URL: "redis://redis:6379/1"

  nginx:
    image: nginx:latest
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./fullchain.pem:/etc/letsencrypt/amplify.gov.au/fullchain.pem
      - ./privkey.pem:/etc/letsencrypt/amplify.gov.au/fullchain.pem
    depends_on:
      - amplify

volumes:
  amplify_production_pgdata:
